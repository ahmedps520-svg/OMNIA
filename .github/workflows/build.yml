# Compile check on a macOS runner: resolves packages, builds for device (unsigned) and runs the
# unit tests plus the llama.cpp engine tests (tiny real models, CPU) on an iPad simulator.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    # MLX (C++ and Metal shaders) compiles twice: for devices and for the simulator.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The llama.cpp release has no iOS Simulator slice, so the tests use a copy with one built
      # from the same tag (scripts/build-llama-xcframework.sh). It's cached per pinned release.
      - name: Restore llama.cpp framework with simulator slice
        id: llama
        uses: actions/cache@v4
        with:
          path: Packages/LlamaFramework/llama.xcframework
          key: llama-xcframework-${{ hashFiles('Packages/LlamaFramework/Package.swift', 'scripts/build-llama-xcframework.sh') }}

      - name: Build llama.cpp simulator slice
        if: steps.llama.outputs.cache-hit != 'true'
        run: scripts/build-llama-xcframework.sh

      # MLX compiles Metal shaders; the image installs the toolchain, but make sure. (-showComponent
      # succeeds even when it is missing, so its status is read.)
      - name: Metal toolchain
        run: |
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q "Status: installed"; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project OMNIA.xcodeproj -scheme OMNIA
          # The resolved versions, readable from the run page, so they can be pinned in the repository.
          RESOLVED=OMNIA.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -f "$RESOLVED" ]; then
            echo "::notice title=Package.resolved::$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",",":")))' "$RESOLVED")"
          fi

      - name: Build for iOS devices (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OMNIA.xcodeproj \
            -scheme OMNIA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/device-build.log"

      # Tiny public models for the engine tests (scripts/fetch-test-models.sh), cached.
      - name: Restore engine test models
        id: models
        uses: actions/cache@v4
        with:
          path: ~/omnia-test-models
          key: omnia-test-models-${{ hashFiles('scripts/fetch-test-models.sh') }}
          # A changed list starts from the previous files; the script fetches only what's new.
          restore-keys: omnia-test-models-

      - name: Download engine test models
        if: steps.models.outputs.cache-hit != 'true'
        run: scripts/fetch-test-models.sh ~/omnia-test-models

      - name: Unit and engine tests (iPad simulator)
        run: |
          # xcodebuild passes TEST_RUNNER_-prefixed variables to the tests without the prefix.
          export TEST_RUNNER_OMNIA_TEST_MODELS="$HOME/omnia-test-models"
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          names = [d["name"] for runtime, items in devices.items() if "iOS" in runtime for d in items]
          ipads = [n for n in names if n.startswith("iPad Pro")] or [n for n in names if n.startswith("iPad")]
          print((ipads or names)[0])')
          echo "Testing on: $SIMULATOR"
          # One test at a time: llama.cpp spreads each model over the CPU cores, and suites running
          # in parallel on CI's few cores stall each other's threads.
          set -o pipefail
          xcodebuild test \
            -project OMNIA.xcodeproj \
            -scheme OMNIA \
            -destination "platform=iOS Simulator,name=$SIMULATOR,arch=arm64" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test-build.log"

      # Compiler errors as annotations, so a failed build is readable from the run page.
      - name: Report build errors
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP" <<'PY'
          import glob, re, sys
          errors = []
          for path in sorted(glob.glob(sys.argv[1] + "/*-build.log")):
              for line in open(path, errors="replace"):
                  line = line.strip()
                  if ": error: " in line and line not in errors:
                      errors.append(line)
          for line in errors[:20]:
              match = re.match(r"^/Users/runner/work/OMNIA/OMNIA/([^:]+):(\d+):(\d+): error: (.*)$", line)
              if match:
                  print(f"::error file={match[1]},line={match[2]},col={match[3]}::{match[4][:900]}")
              else:
                  print(f"::error::{line[:900]}")
          PY

      # Totals and failures as annotations, readable from the run page and the public API.
      - name: Report test results
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/tests.xcresult" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/tests.xcresult" --compact > "$RUNNER_TEMP/summary.json"
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          print(f"::notice title=Tests::{s.get('passedTests', 0)} passed, {s.get('failedTests', 0)} failed, "
                f"{s.get('skippedTests', 0)} skipped of {s.get('totalTestCount', 0)}")
          for failure in s.get("testFailures", [])[:10]:
              name = failure.get("testIdentifierString") or failure.get("testName", "test")
              text = " ".join(failure.get("failureText", "").split())[:900]
              print(f"::error title={name}::{text}")
          PY
