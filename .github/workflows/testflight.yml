# Archives OMNIA on a macOS runner and uploads it to TestFlight — no local Mac required.
#
# Team ID and bundle prefix come from Config/Signing.xcconfig (not secret).
# Repository secrets (Settings › Secrets and variables › Actions):
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        App Store Connect issuer ID
#   ASC_KEY_P8           The .p8 key file's full text (BEGIN/END lines included)
#                        (or ASC_KEY_P8_BASE64 with the file base64-encoded)
#
# The API key needs the Admin role so Xcode can create the distribution certificate and
# provisioning profile (cloud-managed signing). Create the app record in App Store Connect
# first, with bundle ID "<prefix>.omnia".
name: TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # tr strips the carriage returns a key copied on Windows can carry.
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"
          elif [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "$ASC_KEY_P8_BASE64" | base64 --decode | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"
          else
            echo "::error::Add the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repository secrets first."
            exit 1
          fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey.p8" || { echo "::error::ASC_KEY_P8 doesn't look like a .p8 private key."; exit 1; }

      - name: Set build number
        run: |
          # Unique, increasing build numbers without a local Mac: the workflow run number.
          xcrun agvtool new-version -all "${{ github.run_number }}" || \
            sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" OMNIA.xcodeproj/project.pbxproj

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project OMNIA.xcodeproj \
            -scheme OMNIA \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/OMNIA.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OMNIA.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
